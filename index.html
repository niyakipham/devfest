<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b2a" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 60'%3E%3Cpath d='M24 2C13.5 2 5 10.5 5 21c0 13.4 19 37 19 37s19-23.6 19-37C43 10.5 34.5 2 24 2Z' fill='%2331b6e8' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M24 12.4l2.6 6.6 7 .5-5.3 4.6 1.6 6.8-5.9-3.6-5.9 3.6 1.6-6.8-5.3-4.6 7-.5L24 12.4Z' fill='%23f7c948'/%3E%3C/svg%3E"
    />
    <title>Hà Nội Legends · Phố cổ 20 km²</title>
    <meta
      name="description"
      content="Thế giới mở nhập vai cozy về Hà Nội — đi bộ phố cổ, ăn phở, chụp ảnh hồ Gươm."
    />
    <meta name="color-scheme" content="light" />

    <!--
      Nunito is loaded from the network with preconnect + display=swap instead of a
      CSS @import: the @import blocked first paint behind a parser-blocking fetch,
      which pushed LCP past the 2.5 s budget on 4G (blueprint §2.12 / F8).
      Vietnamese needs the `vietnamese` subset for its diacritics.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- F8: a readable message instead of a blank page when JS is off -->
    <noscript>
      <style>
        #root { display: none; }
        .nojs {
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #0e2a33;
          color: #ffffff;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .nojs div {
          max-width: 34rem;
          line-height: 1.55;
        }
        .nojs h1 { font-size: 1.5rem; margin: 0 0 12px; }
        .nojs p { margin: 0 0 8px; color: #cfe6ee; }
        .nojs code { color: #ffe9a8; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="nojs">
        <div>
          <h1>Hà Nội Legends cần JavaScript</h1>
          <p>
            Trò chơi vẽ phố cổ bằng WebGL trong trình duyệt, nên cần bật JavaScript để chạy.
            Bản lưu của bạn nằm trong trình duyệt và không bị ảnh hưởng.
          </p>
          <p>Bật JavaScript trong <code>Cài đặt trình duyệt → Quyền riêng tư và bảo mật → Nội dung trang web</code>, rồi tải lại trang.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
